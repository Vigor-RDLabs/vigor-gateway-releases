<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigor WebRTC Live Stream Player Sample</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card {
            background: var(--card);
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        input, select {
            width: 100%;
            padding: 0.6rem;
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        input {
            font-family: monospace;
            font-size: 0.85rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        .video-box {
            background: #000;
            border-radius: 0.5rem;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #334155;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .status-tag {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .status-online {
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-offline {
            color: var(--error);
            border: 1px solid var(--error);
        }

        #logs {
            font-family: monospace;
            font-size: 0.8rem;
            background: #030712;
            padding: 0.75rem;
            border-radius: 0.375rem;
            height: 150px;
            overflow-y: auto;
            color: #a7f3d0;
            margin-top: 1.5rem;
            border: 1px solid #1e293b;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📹 Vigor WebRTC Stream Player</h1>
            <p class="subtitle">Vanilla HTML5/JS client integration sample for real-time camera streaming.</p>
        </header>

        <div class="grid">
            <div class="card">
                <label for="clientId">App Client ID</label>
                <input id="clientId" placeholder="client_..." value="">

                <label for="clientSecret">App Client Secret</label>
                <input id="clientSecret" type="password" placeholder="sec_..." value="">

                <label for="cameraSelect">Select Camera</label>
                <select id="cameraSelect">
                    <option value="">-- Load cameras first --</option>
                </select>
            </div>
            <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <label for="baseUrl">Signaling API Base URL</label>
                    <input id="baseUrl" value="https://api.vigorlabs.org">
                </div>
                <div>
                    <button id="btnPlay" onclick="startStreamFlow()">▶ Connect & Play Stream</button>
                </div>
            </div>
        </div>

        <div class="video-box">
            <span id="statusTag" class="status-tag status-offline">● DISCONNECTED</span>
            <video id="remoteVideo" autoplay playsinline muted controls></video>
        </div>

        <div id="logs">&gt; Enter credentials and click [Connect & Play Stream] to start...</div>
    </div>

    <script>
        let peerConnection = null;
        let websocketSignaling = null;

        function log(msg) {
            const el = document.getElementById('logs');
            el.innerHTML += `<br>&gt; ${msg}`;
            el.scrollTop = el.scrollHeight;
        }

        function setStatus(text, isOnline) {
            const tag = document.getElementById('statusTag');
            tag.innerText = `● ${text}`;
            tag.className = `status-tag ${isOnline ? 'status-online' : 'status-offline'}`;
        }

        // Helper to reset active connections
        function cleanupConnections() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (websocketSignaling) {
                websocketSignaling.close();
                websocketSignaling = null;
            }
        }

        async function startStreamFlow() {
            cleanupConnections();

            const baseUrl = document.getElementById('baseUrl').value.trim();
            const clientId = document.getElementById('clientId').value.trim();
            const clientSecret = document.getElementById('clientSecret').value.trim();

            if (!clientId || !clientSecret) {
                log('❌ Error: Client ID and Client Secret are required!');
                return;
            }

            try {
                setStatus('AUTHENTICATING...', false);
                log('1. Authenticating with Vigor API to request Viewer Token...');

                // Step 1: Authenticate and get JWT Token
                const authRes = await fetch(`${baseUrl}/v1/auth/viewer-token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ client_id: clientId, client_secret: clientSecret })
                });
                if (!authRes.ok) throw new Error(`Authentication failed (${authRes.status}): ${authRes.statusText}`);
                const authData = await authRes.json();
                const token = authData.access_token;
                log('✓ Received Viewer JWT Token.');

                // Step 2: Retrieve cameras permitted for this app
                log('2. Fetching available cameras list...');
                const camRes = await fetch(`${baseUrl}/v1/cameras`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!camRes.ok) throw new Error(`Failed to fetch cameras: ${camRes.statusText}`);
                const cameras = await camRes.json();
                if (!cameras || cameras.length === 0) throw new Error('No permitted cameras found under this credential.');

                // Populating dropdown select list
                const selectEl = document.getElementById('cameraSelect');
                const selectedVal = selectEl.value;
                selectEl.innerHTML = '';
                cameras.forEach(cam => {
                    const opt = document.createElement('option');
                    opt.value = cam.id;
                    opt.innerText = `${cam.name || cam.id} [${cam.status.toUpperCase()}]`;
                    selectEl.appendChild(opt);
                });

                if (selectedVal && cameras.some(c => c.id === selectedVal)) {
                    selectEl.value = selectedVal;
                } else {
                    // Try to default to the first online camera, otherwise the first camera in list
                    const firstOnline = cameras.find(c => c.status === 'online');
                    selectEl.value = firstOnline ? firstOnline.id : cameras[0].id;
                }

                const targetCamId = selectEl.value;
                const targetCam = cameras.find(c => c.id === targetCamId);
                log(`✓ Target camera selected: ${targetCam.name || targetCam.id} (ID: ${targetCam.id})`);

                // Step 3: Initialize live streaming session
                log('3. Requesting live WebRTC streaming session...');
                setStatus('INITIALIZING SESSION...', false);
                const sessRes = await fetch(`${baseUrl}/v1/cameras/${targetCam.id}/sessions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                if (!sessRes.ok) {
                    const errJson = await sessRes.json().catch(() => ({}));
                    const detailStr = typeof errJson.detail === 'object' ? JSON.stringify(errJson.detail) : (errJson.detail || sessRes.statusText);
                    throw new Error(`Create session failed (${sessRes.status}): ${detailStr}`);
                }
                const sessionData = await sessRes.json();
                log(`✓ Created Session ID: ${sessionData.session_id}`);

                // Step 4: WebRTC Peer Connection and Signaling Exchange
                log('4. Building RTCPeerConnection and connecting to WebSockets signaling channel...');
                setStatus('NEGOTIATING WEBRTC...', false);

                peerConnection = new RTCPeerConnection({
                    bundlePolicy: "max-bundle",
                    iceServers: sessionData.ice_servers || []
                });

                // Attach track reception callback
                peerConnection.ontrack = (evt) => {
                    log('🎉 Success! WebRTC media track received from Vigor Gateway!');
                    const videoEl = document.getElementById('remoteVideo');
                    videoEl.srcObject = evt.streams[0];
                    videoEl.play().catch(err => console.warn("Video playback autostart failed:", err));
                    setStatus('LIVE STREAMING (WEBRTC)', true);
                };

                peerConnection.oniceconnectionstatechange = () => {
                    log(`🧊 ICE Connection state: ${peerConnection.iceConnectionState}`);
                    if (peerConnection.iceConnectionState === 'disconnected' || peerConnection.iceConnectionState === 'failed') {
                        setStatus('STREAM DISCONNECTED', false);
                    }
                };

                peerConnection.onicecandidate = (evt) => {
                    if (evt.candidate && websocketSignaling && websocketSignaling.readyState === WebSocket.OPEN) {
                        websocketSignaling.send(JSON.stringify({
                            id: targetCam.id,
                            type: 'candidate',
                            candidate: evt.candidate
                        }));
                    }
                };

                // Websocket signaling connection
                const wsProtocol = baseUrl.startsWith('https') ? 'wss' : 'ws';
                const baseWsHost = baseUrl.replace(/^https?:\/\//, '');
                const wsClientId = `viewer_${Math.random().toString(36).substring(2, 9)}`;
                const wsUrl = `${wsProtocol}://${baseWsHost}/v1/signaling/${sessionData.session_id}/${wsClientId}?token=${sessionData.token}`;

                websocketSignaling = new WebSocket(wsUrl);

                websocketSignaling.onopen = () => {
                    log('✓ WebSocket Signaling Channel connected. Sending initial "request" frame to target Camera...');
                    websocketSignaling.send(JSON.stringify({
                        id: targetCam.id,
                        type: 'request'
                    }));
                };

                websocketSignaling.onmessage = async (evt) => {
                    if (typeof evt.data !== 'string') return;
                    try {
                        const msg = JSON.parse(evt.data);
                        log(`📥 Received signaling payload: ${msg.type}`);

                        if (msg.type === 'offer') {
                            log('✓ Received SDP Offer from Edge Gateway. Applying remote description and creating SDP Answer...');
                            await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: msg.sdp }));
                            
                            const answer = await peerConnection.createAnswer();
                            await peerConnection.setLocalDescription(answer);

                            log('⏳ Waiting for local ICE gathering to complete...');
                            await new Promise(resolve => {
                                if (peerConnection.iceGatheringState === 'complete') resolve();
                                else {
                                    const check = () => {
                                        if (peerConnection.iceGatheringState === 'complete') {
                                            peerConnection.removeEventListener('icegatheringstatechange', check);
                                            resolve();
                                        }
                                    };
                                    peerConnection.addEventListener('icegatheringstatechange', check);
                                    setTimeout(resolve, 2000); // Safety fallback timeout
                                }
                            });

                            log('✓ ICE gathering complete. Dispatching SDP Answer to Edge Gateway...');
                            websocketSignaling.send(JSON.stringify({
                                id: targetCam.id,
                                type: peerConnection.localDescription.type,
                                sdp: peerConnection.localDescription.sdp
                            }));
                        }
                    } catch (e) {
                        log(`❌ Error processing signaling message: ${e.message}`);
                    }
                };

                websocketSignaling.onclose = () => {
                    log('ℹ WebSocket signaling channel closed.');
                };

                websocketSignaling.onerror = (err) => {
                    log(`❌ WebSocket signaling channel error.`);
                };

            } catch (err) {
                log(`❌ Error: ${err.message}`);
                setStatus('CONNECTION ERROR', false);
                cleanupConnections();
            }
        }
    </script>
</body>

</html>
